<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, sans-serif;
      color: #e0e0e0;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #fff; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #aaa; }
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input[type="password"]:focus { outline: none; border-color: #5865f2; }
    button {
      width: 100%;
      padding: 0.65rem;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
    .error {
      background: #3d1a1a;
      border: 1px solid #6b2e2e;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      color: #f87171;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Media Gallery</h1>
    <div class="error" id="err">Incorrect password.</div>
    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
